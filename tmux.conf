# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum settings
set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Mouse settings
set -g mouse on 

# Resurrect settings
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-strategy-vim 'on'
set -g @resurrect-strategy-nvim 'on'

# Copy mode: vi keys + yank to macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Move pane to previous/next window (prefix + Alt+b/f)
bind-key M-b join-pane -t :-
bind-key M-f join-pane -t :+

# Rebalance layout: even column widths (preserves row splits)
bind-key = select-layout even-horizontal

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
